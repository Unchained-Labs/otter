name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      # The pre-commit config is the single quality gate: it runs cargo fmt,
      # clippy -D warnings, the test suite, and cargo audit. Keeping the list in
      # one place means local hooks and CI cannot drift apart.
      - name: Run pre-commit
        run: pre-commit run --all-files

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Scoring logic only — no live stack required. Also validates the shipped
      # scenarios.json for unique ids and budgets that fit their timeouts.
      - name: Run eval harness tests
        working-directory: evals
        run: python3 -m unittest discover -s . -p 'test_*.py' -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      # The docs site deploys independently, so a broken link or bad config
      # would otherwise only be caught by the hosting provider.
      - name: Build docs
        working-directory: docs
        run: npm run build
